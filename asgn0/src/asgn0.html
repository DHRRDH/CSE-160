<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Assignment 0: Draw a vector</title>
</head>

<body>
  <canvas id="example" width="400" height="400">
    Please use a browser that supports "canvas"
  </canvas>
  <br />

  <label for="xCoord">V1 X Coordinate:</label>
  <input type="number" id="xCoord" value="2.25" step="0.01" />
  <label for="yCoord">V1 Y Coordinate:</label>
  <input type="number" id="yCoord" value="2.25" step="0.01" />
  <br />

  <label for="xCoord2">V2 X Coordinate:</label>
  <input type="number" id="xCoord2" value="0.0" step="0.01" />
  <label for="yCoord2">V2 Y Coordinate:</label>
  <input type="number" id="yCoord2" value="0.0" step="0.01" />
  <br />

  <input type="button" value="Draw Vectors" onclick="handleDrawEvent()" />
  <br /><br />

  <label for="operation">Select Operation:</label>
  <select id="operation">
    <option value="add">Add</option>
    <option value="sub">Subtract</option>
    <option value="mul">Multiply</option>
    <option value="div">Divide</option>
    <option value="magnitude">Magnitude</option>
    <option value="normalize">Normalize</option>
    <option value="angle">Angle between</option>
    <option value="area">Area</option>
  </select>

  <label for="scalar">Scalar (for mul/div):</label>
  <input type="number" id="scalar" value="1.0" step="0.1" />

  <input type="button" value="Compute Operation" onclick="handleDrawOperationEvent()" />

  <script src="../lib/cuon-matrix-cse160.js"></script>
  <script src="asgn0.js"></script>
</body>
</html>
